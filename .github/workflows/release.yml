name: release
on:
  push:
    tags: ['*']
jobs:
  publish:
    # Windows for the same reason ci is: the tests compare screenshot baselines rasterized here.
    runs-on: windows-latest
    permissions:
      contents: read
      # Lets the job mint the OIDC token nuget.org trades for a short-lived publishing key.
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\ms-playwright
          key: playwright-${{ hashFiles('Directory.Packages.props') }}
      # The tag is the version: tag 1.2.3 (or v1.2.3) publishes 1.2.3. The Version in
      # Directory.Build.props is only what local builds get.
      - name: Resolve the version from the tag
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - name: Build
        run: dotnet build src/BlazorQL.slnx -c Release -p:Version=${{ env.version }}
      - name: Test
        run: dotnet test src/BlazorQL.slnx -c Release --no-build
      - name: Upload received snapshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: received
          path: '**/*.received.*'
          if-no-files-found: ignore
      # After the build, never instead of it: packing the RCL from a clean obj fails on its
      # static web assets manifest.
      - name: Pack
        run: dotnet pack src/BlazorQL -c Release --no-build -o packages -p:Version=${{ env.version }}
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: packages/*
      # Trusted publishing: no stored API key. nuget.org validates GitHub's OIDC token against the
      # policy naming this repository and this workflow file, and returns a key good for an hour —
      # so this stays immediately before the push.
      - name: NuGet login
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Push to nuget.org
        shell: bash
        run: >
          dotnet nuget push packages/*.nupkg
          --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
