<div class="blazorql-docs">
  <div class="blazorql-docs-header">
    <div class="blazorql-docs-nav">
      <div class="blazorql-doc-title">Docs</div>
    </div>
  </div>
  <div class="blazorql-docs-body ">
    <div class="blazorql-doc-search" data-testid="doc-search">
      <input type="text" id="blazorql-doc-search-input" placeholder="Search schema..." aria-label="Search schema..." value="" blazor:oninput="1">
    </div>
    <div class="blazorql-doc-page" data-testid="doc-root">
      <div class="blazorql-markdown ">
        <p>A hand-written
          <em>subset</em>
          of the sample schema, for doc explorer tests.</p>
      </div>
      <div class="blazorql-doc-section-title">Root Types</div>
      <div class="blazorql-doc-root-types">
        <div class="blazorql-doc-root-type">
          <span class="blazorql-doc-keyword">query</span>
          <span>:
          </span>
          <span class="blazorql-type-ref">
            <button type="button" class="blazorql-type-link" blazor:onclick="2">Query</button>
          </span>
        </div>
      </div>
      <div class="blazorql-doc-section-title">All Schema Types</div>
      <div class="blazorql-doc-type-list">
        <div>
          <span class="blazorql-type-ref">
            <button type="button" class="blazorql-type-link" blazor:onclick="3">Color</button>
          </span>
        </div>
        <div>
          <span class="blazorql-type-ref">
            <button type="button" class="blazorql-type-link" blazor:onclick="4">Int</button>
          </span>
        </div>
        <div>
          <span class="blazorql-type-ref">
            <button type="button" class="blazorql-type-link" blazor:onclick="5">JSON</button>
          </span>
        </div>
        <div>
          <span class="blazorql-type-ref">
            <button type="button" class="blazorql-type-link" blazor:onclick="6">Named</button>
          </span>
        </div>
        <div>
          <span class="blazorql-type-ref">
            <button type="button" class="blazorql-type-link" blazor:onclick="7">Person</button>
          </span>
        </div>
        <div>
          <span class="blazorql-type-ref">
            <button type="button" class="blazorql-type-link" blazor:onclick="8">PetInput</button>
          </span>
        </div>
        <div>
          <span class="blazorql-type-ref">
            <button type="button" class="blazorql-type-link" blazor:onclick="9">Post</button>
          </span>
        </div>
        <div>
          <span class="blazorql-type-ref">
            <button type="button" class="blazorql-type-link" blazor:onclick="10">SearchResult</button>
          </span>
        </div>
        <div>
          <span class="blazorql-type-ref">
            <button type="button" class="blazorql-type-link" blazor:onclick="11">String</button>
          </span>
        </div>
      </div>
    </div>
  </div>
  <div class="blazorql-docs-sdl blazorql-hidden"></div>
</div>
